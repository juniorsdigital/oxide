name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Teaching interpreter matches rustc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Rebuild the interpreter bundle
        run: node engine/build.mjs
      - name: Check the committed bundle is up to date
        run: git diff --exit-code ui/rustlite.js
      - name: Compare every lesson and test program with rustc
        run: node tests/harness.js

  backend:
    name: Desktop backend tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
